name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - run: dotnet run --project tests/RenameEngineTests.csproj --nologo
      - run: dotnet build OpenRename.csproj --configuration Release --nologo
      - run: pwsh -File tests/Test-Release.ps1
